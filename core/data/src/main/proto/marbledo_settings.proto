syntax = "proto3";

option java_package = "com.marbledo.core.data.settings";
option java_multiple_files = true;

message MarbleDoSettingsProto {
  string theme_mode = 1;
  string language_tag = 2;
  string numeral_mode = 3;
  string countdown_theme = 4;
  bool week_starts_saturday = 5;
  bool calendar_notifications_enabled = 6;
  bool official_events_enabled = 7;
  bool religious_events_enabled = 8;
  bool national_events_enabled = 9;
  bool personal_events_enabled = 10;
  bool quiet_hours_enabled = 11;
  int32 quiet_start_minute = 12;
  int32 quiet_end_minute = 13;
  float font_scale = 14;
  bool reduce_motion = 15;
  int32 lunar_offset_days = 16;
  string countdown_calendar = 17;
  repeated string task_categories = 18;
  bool occasion_auto_update_enabled = 19;
  bool persistent_date_notification_enabled = 20;
  // Optional presence lets an upgraded install that never saved this field adopt the new default (on).
  optional bool status_icon_enabled = 21;
  string status_bar_calendar = 22;
  optional int32 reminder_lead_minutes = 23;
  // Optional presence keeps the default (on) for installs saved before world days existed.
  optional bool international_events_enabled = 24;
  // Occasions the user starred. Ids come from the catalog (calendar-month-day-titleEn).
  repeated string favorite_occasion_ids = 25;
  // Days before a favourite occasion to remind the user; 0 keeps occasion reminders off.
  int32 occasion_reminder_lead_days = 26;
  bool education_mode_enabled = 27;
  bool thursday_weekend_enabled = 28;
  // How the day number is drawn in the status-bar icon (BOLD_DIGITS / CALENDAR_PAGE / ICON_ONLY).
  string status_icon_style = 29;
  // Look of the habit cabinet; a habit may override it with its own theme id.
  string habit_theme = 30;
}
