name: Signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.0.2 or v1.0.2). A missing v-prefixed tag is created at the selected ref."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Normalize version and create the release tag if needed
        id: release_tag
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version_input="$RELEASE_VERSION_INPUT"
          # Trim whitespace and accept either a version or a full tag ref.
          version_input="${version_input#"${version_input%%[![:space:]]*}"}"
          version_input="${version_input%"${version_input##*[![:space:]]}"}"
          version_input="${version_input#refs/tags/}"
          version="${version_input#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error title=Invalid release version::Enter a semantic version such as 1.2.3 or v1.2.3."
            exit 2
          fi

          tag="v$version"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag '$tag' already exists; the existing tag will not be moved."
          else
            ls_remote_status=$?
            if [[ "$ls_remote_status" -ne 2 ]]; then
              echo "::error title=Unable to inspect remote tags::git ls-remote failed with exit code $ls_remote_status."
              exit "$ls_remote_status"
            fi

            echo "Release tag '$tag' does not exist. Creating it at $RELEASE_SOURCE_SHA."
            git tag "$tag" "$RELEASE_SOURCE_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "Created release tag '$tag'."
            elif git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
              # Another release run may have created the tag between our check and push.
              echo "::warning::Another run created '$tag' first; using the existing remote tag."
              git tag -d "$tag" >/dev/null
            else
              echo "::error title=Unable to create release tag::Could not push '$tag'. Confirm this workflow has contents: write permission."
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out versioned release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses and install compile platform
        run: |
          COMPILE_SDK="$(sed -n 's/^compileSdk = "\([^" ]*\)"/\1/p' gradle/libs.versions.toml)"
          BUILD_TOOLS="$(sed -n 's/^buildTools = "\([^" ]*\)"/\1/p' gradle/libs.versions.toml)"
          test -n "$COMPILE_SDK" && test -n "$BUILD_TOOLS"
          # The catalog value includes Android's minor API level, for example 37.2.
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "MARBLE_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "MARBLE_VERSION_CODE=$RELEASE_RUN_NUMBER" >> "$GITHUB_ENV"
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are required. See README.md (Release signing)." >&2
            exit 2
          fi
          key_file="$RUNNER_TEMP/marbledo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          {
            echo "MARBLE_SIGNING_STORE_FILE=$key_file"
            echo "MARBLE_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MARBLE_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MARBLE_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Generate artifact checksums
        run: |
          cd app/build/outputs
          sha256sum apk/release/*.apk bundle/release/*.aab > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Expand the build output globs in the shell so that gh only ever
          # receives real file paths. nullglob keeps an unmatched glob from
          # reaching gh as a literal pattern, which gh rejects with
          # "syntax error in pattern".
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          bundles=(app/build/outputs/bundle/release/*.aab)
          if (( ${#apks[@]} == 0 || ${#bundles[@]} == 0 )); then
            echo "::error title=Missing release artifacts::Expected a signed APK and an AAB under app/build/outputs before publishing."
            exit 1
          fi
          artifacts=("${apks[@]}" "${bundles[@]}" "$RUNNER_TEMP/SHA256SUMS.txt")
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact" || { echo "::error title=Missing release artifact::'$artifact' does not exist."; exit 1; }
          done
          # Each arm of the next command is continued with a single backslash.
          # A doubled backslash is not a continuation: it becomes a literal
          # backslash argument, which gh treats as a malformed glob pattern.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --title "MarbleDo $RELEASE_TAG" \
              --generate-notes
          fi
