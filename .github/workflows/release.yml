name: Signed Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases. A pending run may be superseded, but its changes are
# included in the next run's range from the last published release.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan version and release notes
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_plan.py

      - name: Report the version decision
        run: cat "$RUNNER_TEMP/version-decision.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the changelog is scoped to this version and emoji-annotated
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous }}
        run: |
          set -euo pipefail
          python3 scripts/check_release_notes.py \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --tag "$RELEASE_TAG" \
            --previous "$PREVIOUS_TAG" \
            --source "$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses and install compile platform
        run: |
          COMPILE_SDK="$(sed -n 's/^compileSdk = "\([^" ]*\)"/\1/p' gradle/libs.versions.toml)"
          BUILD_TOOLS="$(sed -n 's/^buildTools = "\([^" ]*\)"/\1/p' gradle/libs.versions.toml)"
          test -n "$COMPILE_SDK" && test -n "$BUILD_TOOLS"
          # The catalog value includes Android's minor API level, for example 37.2.
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "MARBLE_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "MARBLE_VERSION_CODE=$RELEASE_RUN_NUMBER" >> "$GITHUB_ENV"
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are required. See README.md (Release signing)." >&2
            exit 2
          fi
          key_file="$RUNNER_TEMP/marbledo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          {
            echo "MARBLE_SIGNING_STORE_FILE=$key_file"
            echo "MARBLE_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MARBLE_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MARBLE_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # AGP 9 refuses an AAB and ABI-split APKs in one Gradle invocation
      # (issuetracker 402800800). app/build.gradle.kts disables splits for
      # bundle* task names, so the two invocations must stay separate: the
      # bundle first (no stale per-split shrunk-resources files), then the APKs.
      - name: Build signed AAB
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease

      - name: Build signed APKs for every ABI
        run: |
          set -euo pipefail
          # The bundle invocation (splits off) can leave one unsplit release APK.
          # Remove it so only the five signed per-ABI/universal APKs are published.
          rm -f app/build/outputs/apk/release/*.apk
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify every ABI artifact exists
        run: |
          set -euo pipefail
          for abi in universal armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "app/build/outputs/apk/release/app-${abi}-release.apk" || { echo "::error::Missing APK for $abi"; exit 1; }
          done
          compgen -G 'app/build/outputs/bundle/release/*.aab' >/dev/null || { echo "::error::Missing AAB"; exit 1; }

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum \
            apk/release/app-universal-release.apk \
            apk/release/app-armeabi-v7a-release.apk \
            apk/release/app-arm64-v8a-release.apk \
            apk/release/app-x86-release.apk \
            apk/release/app-x86_64-release.apk \
            bundle/release/*.aab > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-x86-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
          )
          bundles=(app/build/outputs/bundle/release/*.aab)
          (( ${#apks[@]} == 5 )) || { echo "::error::Expected five signed APKs, found ${#apks[@]}"; exit 1; }
          (( ${#bundles[@]} > 0 )) || { echo "::error::Missing AAB"; exit 1; }
          # A failed publication can be retried without moving an existing tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          artifacts=("${apks[@]}" "${bundles[@]}" "$RUNNER_TEMP/SHA256SUMS.txt")
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --target "$GITHUB_SHA" \
            --title "MarbleDo $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest

      - name: Verify the published release is latest and complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          latest="$(gh api 'repos/{owner}/{repo}/releases/latest' --jq .tag_name)"
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "::error::$RELEASE_TAG is not the latest release (latest is $latest)"
            exit 1
          fi
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for name in app-universal-release.apk app-armeabi-v7a-release.apk \
                      app-arm64-v8a-release.apk app-x86-release.apk app-x86_64-release.apk \
                      SHA256SUMS.txt; do
            grep -Fxq "$name" <<<"$assets" || { echo "::error::Missing release asset $name"; exit 1; }
          done
          grep -Eq '\.aab$' <<<"$assets" || { echo "::error::Missing AAB asset"; exit 1; }
          echo "Verified: $RELEASE_TAG is the latest release and carries every ABI artifact."
